<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>고객 관리 - 화장품 AI 관리자</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <nav>
        <a href="index.html">질문하기</a>
        <a href="customers.html" class="current">고객 관리</a>
      </nav>
      <h1>고객 관리</h1>
      <p>고객을 누르면 구매 내역과 후기, 그리고 AI 에게 보내는 정보를 볼 수 있습니다.</p>
    </header>

    <main class="two-columns">
      <section class="list-panel">
        <input id="filter" type="text" placeholder="이름이나 지역으로 찾기" autocomplete="off" />
        <p id="count" class="hint"></p>
        <div id="customer-list"></div>
      </section>

      <section class="detail-panel">
        <p id="empty" class="hint">왼쪽에서 고객을 선택하세요.</p>

        <div id="detail" class="hidden">
          <!-- 이 화면의 핵심입니다. 같은 고객 정보를 두 벌 나란히 보여줍니다. -->
          <div class="compare">
            <div class="compare-side">
              <span class="label">관리자 화면에 보이는 정보</span>
              <table id="raw-info"></table>
            </div>
            <div class="compare-side masked-side">
              <span class="label">AI 에게 보내는 정보</span>
              <table id="masked-info"></table>
            </div>
          </div>
          <p class="hint compare-hint">
            전화번호와 이메일이 가려진 채로 AI 에게 갑니다. 가린 값은 되돌리지 않습니다.
          </p>

          <div class="panel">
            <span class="label" id="purchase-label">구매 내역</span>
            <div id="purchases"></div>
          </div>

          <div class="panel">
            <span class="label" id="review-label">후기</span>
            <div id="reviews"></div>
          </div>

        </div>
      </section>
    </main>

    <!-- 목록을 HTML 문자열로 그리기 때문에 escapeHtml 이 먼저 있어야 합니다 -->
    <script src="escape.js"></script>
    <script src="customers.js"></script>
  </body>
</html>
